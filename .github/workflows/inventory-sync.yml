name: Nightly Inventory Sync

on:
  schedule:
    # GitHub Actions schedules are best-effort. Run staggered morning checks
    # across the New Hampshire opening window. The date guard below makes
    # duplicate scheduled runs inexpensive once today's scrape has succeeded.
    - cron: '7 11 * * *'
    - cron: '7 12 * * *'
    - cron: '7 13 * * *'
    - cron: '7 14 * * *'
    - cron: '7 15 * * *'
    - cron: '7 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a scrape even if inventory is already current today'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'scraper/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/inventory-sync.yml'

permissions:
  contents: write

concurrency:
  group: inventory-sync
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether inventory needs refresh
        id: refresh
        shell: bash
        run: |
          should_scrape=true
          event_name="${{ github.event_name }}"
          force_refresh="${{ inputs.force || false }}"

          if [[ "$event_name" == "schedule" ]]; then
            local_hour=$(TZ=America/New_York date +%H)
            if (( 10#$local_hour < 7 )); then
              echo "Scheduled recovery window fired before 7 AM local time. Skipping."
              should_scrape=false
            fi
          fi

          if [[ "$should_scrape" == "true" && ( "$event_name" == "schedule" || "$event_name" == "workflow_dispatch" ) && "$force_refresh" != "true" ]]; then
            today=$(TZ=America/New_York date +%F)
            generated_at=$(grep -m1 '"generatedAt"' data/inventory.json | sed -E 's/.*"generatedAt": "([^"]+)".*/\1/')

            if [[ -n "$generated_at" ]]; then
              generated_day=$(TZ=America/New_York date -d "$generated_at" +%F 2>/dev/null || true)
              if [[ "$generated_day" == "$today" ]]; then
                echo "Inventory is already current for $today. Skipping duplicate scrape."
                should_scrape=false
              else
                echo "Inventory is stale ($generated_day). Refresh will run for $today."
              fi
            else
              echo "Could not determine inventory freshness. Refresh will run defensively."
            fi
          fi

          echo "should_scrape=$should_scrape" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.refresh.outputs.should_scrape == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.refresh.outputs.should_scrape == 'true'
        run: npm ci --no-audit --no-fund

      - name: Check scraper JavaScript
        if: steps.refresh.outputs.should_scrape == 'true'
        run: npm run check:scraper

      - name: Run scraper tests
        if: steps.refresh.outputs.should_scrape == 'true'
        run: npm run test:scraper

      - name: Install Chromium
        if: steps.refresh.outputs.should_scrape == 'true'
        run: npx playwright install --with-deps chromium

      - name: Scrape inventory
        if: steps.refresh.outputs.should_scrape == 'true'
        run: npm run scrape

      - name: Commit inventory changes
        if: steps.refresh.outputs.should_scrape == 'true'
        run: |
          git config user.name "genesis-inventory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inventory.json data/inventory.csv data/changes.json data/history.json
          if git diff --cached --quiet; then
            echo "No inventory changes to commit."
            exit 0
          fi
          git commit -m "Update nightly Genesis inventory"
          git pull --rebase origin main
          git push
