name: Nightly Inventory Sync

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scraper/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/inventory-sync.yml'

permissions:
  contents: write

concurrency:
  group: inventory-sync
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check scraper JavaScript
        run: npm run check:scraper

      - name: Run scraper tests
        run: npm run test:scraper

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape inventory
        run: npm run scrape

      - name: Commit inventory changes
        run: |
          git config user.name "genesis-inventory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inventory.json data/inventory.csv data/changes.json data/history.json
          if git diff --cached --quiet; then
            echo "No inventory changes to commit."
            exit 0
          fi
          git commit -m "Update nightly Genesis inventory"
          git pull --rebase origin main
          git push
