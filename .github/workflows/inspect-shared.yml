name: Inspect Shared Inventory

on:
  push:
    branches:
      - main
    paths:
      - 'tools/inspect-shared.js'
      - '.github/workflows/inspect-shared.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-shared-inventory
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Inspect shared pages
        run: node tools/inspect-shared.js
