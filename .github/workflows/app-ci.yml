name: Inventory App CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'e2e/**'
      - 'data/inventory.json'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'e2e/**'
      - 'data/inventory.json'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read

concurrency:
  group: inventory-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check search JavaScript
        run: npm run check:search

      - name: Run search tests
        run: npm run test:search

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke test
        run: npm run test:e2e
