name: Inventory Freshness Watchdog

on:
  schedule:
    # Independent staggered checks. If the main scheduler was delayed or missed,
    # this workflow dispatches the inventory sync only when today's data is stale.
    # Keep these away from the top of the hour to reduce GitHub scheduler pressure.
    - cron: '53 8 * * *'
      timezone: 'America/New_York'
    - cron: '38 10 * * *'
      timezone: 'America/New_York'
    - cron: '23 12 * * *'
      timezone: 'America/New_York'
  workflow_run:
    workflows:
      - 'Nightly Inventory Sync'
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'app/page.js'
      - 'app/api/search/route.js'
      - 'app/api/inventory-health/**'
      - 'lib/inventorySource.js'
      - '.github/workflows/inventory-freshness-watch.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: inventory-freshness-watchdog
  cancel-in-progress: false

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check inventory date and recover if stale
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          today=$(TZ=America/New_York date +%F)
          generated_at=$(grep -m1 '"generatedAt"' data/inventory.json | sed -E 's/.*"generatedAt": "([^"]+)".*/\1/')
          generated_day=""

          if [[ -n "$generated_at" ]]; then
            generated_day=$(TZ=America/New_York date -d "$generated_at" +%F 2>/dev/null || true)
          fi

          if [[ "$generated_day" == "$today" ]]; then
            echo "Inventory is current for $today."
            echo "repo_current=true" >> "$GITHUB_OUTPUT"
            echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "repo_current=false" >> "$GITHUB_OUTPUT"
          echo "Inventory is stale or unreadable (last day: ${generated_day:-unknown}). Dispatching recovery sync."
          gh workflow run inventory-sync.yml --ref main

      - name: Verify production inventory delivery
        if: steps.freshness.outputs.repo_current == 'true'
        env:
          EXPECTED_GENERATED_AT: ${{ steps.freshness.outputs.generated_at }}
          HEALTH_URL: https://genesis-manchester.vercel.app/api/inventory-health
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            response=$(curl --fail --silent --show-error --max-time 15 "$HEALTH_URL" || true)

            if [[ -n "$response" ]]; then
              if HEALTH_RESPONSE="$response" node --input-type=module -e '
                const health = JSON.parse(process.env.HEALTH_RESPONSE);
                const expected = Date.parse(process.env.EXPECTED_GENERATED_AT);
                const actual = Date.parse(health.generatedAt || "");
                if (health.current === true && Number.isFinite(actual) && actual >= expected) {
                  console.log("Production is current: " + health.generatedAt + " via " + health.source + ".");
                  process.exit(0);
                }
                console.error("Production mismatch: generatedAt=" + health.generatedAt + ", current=" + health.current + ", source=" + health.source);
                process.exit(1);
              '; then
                exit 0
              fi
            else
              echo "Production health endpoint did not return a successful response on attempt $attempt."
            fi

            if [[ "$attempt" != "6" ]]; then
              sleep 20
            fi
          done

          echo "::error::Production is not serving the current validated inventory snapshot."
          exit 1
