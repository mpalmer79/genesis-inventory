name: Inventory Scraper CI

on:
  push:
    branches:
      - main
    paths:
      - 'scraper/**'
      - 'package.json'
      - '.github/workflows/scraper-ci.yml'
  pull_request:
    paths:
      - 'scraper/**'
      - 'package.json'
      - '.github/workflows/scraper-ci.yml'

permissions:
  contents: read

concurrency:
  group: inventory-scraper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check scraper JavaScript
        run: npm run check:scraper

      - name: Run scraper tests
        run: npm run test:scraper
